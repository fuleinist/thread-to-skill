<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc">
  <title id="title">The Thread to Skills self-improvement loop</title>
  <desc id="desc">A thread is distilled into a skill, suggested proactively, applied by an agent, and its outcome feeds back into confidence and review.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1000" y2="700" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="core" x1="390" y1="250" x2="610" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="0.55" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748B"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1000" height="700" rx="32" fill="url(#bg)"/>
  <text x="56" y="76" font-family="Segoe UI, Inter, sans-serif" font-size="36" font-weight="700" fill="#F8FAFC">The self-improvement loop</text>
  <text x="56" y="110" font-family="Segoe UI, Inter, sans-serif" font-size="19" fill="#94A3B8">Every suggestion and every outcome makes the next answer better.</text>

  <circle cx="500" cy="382" r="238" fill="none" stroke="#1E293B" stroke-width="2" stroke-dasharray="4 10"/>
  <circle cx="500" cy="382" r="118" fill="url(#core)" filter="url(#shadow)"/>
  <circle cx="500" cy="382" r="118" fill="none" stroke="#A5B4FC" stroke-opacity="0.5" stroke-width="2"/>
  <text x="500" y="368" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">Compounding</text>
  <text x="500" y="398" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">team memory</text>
  <text x="500" y="428" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="14" fill="#E0E7FF">local · portable · yours</text>

  <!-- Nodes -->
  <g filter="url(#shadow)">
    <rect x="410" y="102" width="180" height="72" rx="18" fill="#111827" stroke="#334155"/>
    <circle cx="438" cy="138" r="6" fill="#6366F1"/>
    <text x="456" y="132" font-family="Segoe UI, Inter, sans-serif" font-size="18" font-weight="700" fill="#F8FAFC">Thread</text>
    <text x="456" y="154" font-family="Segoe UI, Inter, sans-serif" font-size="13" fill="#94A3B8">the raw conversation</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="690" y="236" width="190" height="72" rx="18" fill="#111827" stroke="#334155"/>
    <circle cx="718" cy="272" r="6" fill="#8B5CF6"/>
    <text x="736" y="266" font-family="Segoe UI, Inter, sans-serif" font-size="18" font-weight="700" fill="#F8FAFC">Distill</text>
    <text x="736" y="288" font-family="Segoe UI, Inter, sans-serif" font-size="13" fill="#94A3B8">steps, rules, pitfalls</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="690" y="456" width="190" height="72" rx="18" fill="#111827" stroke="#334155"/>
    <circle cx="718" cy="492" r="6" fill="#14B8A6"/>
    <text x="736" y="486" font-family="Segoe UI, Inter, sans-serif" font-size="18" font-weight="700" fill="#F8FAFC">Skill</text>
    <text x="736" y="508" font-family="Segoe UI, Inter, sans-serif" font-size="13" fill="#94A3B8">SKILL.md + metadata</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="410" y="590" width="180" height="72" rx="18" fill="#111827" stroke="#334155"/>
    <circle cx="438" cy="626" r="6" fill="#F59E0B"/>
    <text x="456" y="620" font-family="Segoe UI, Inter, sans-serif" font-size="18" font-weight="700" fill="#F8FAFC">Suggest</text>
    <text x="456" y="642" font-family="Segoe UI, Inter, sans-serif" font-size="13" fill="#94A3B8">hooks surface it</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="120" y="456" width="190" height="72" rx="18" fill="#111827" stroke="#334155"/>
    <circle cx="148" cy="492" r="6" fill="#0EA5E9"/>
    <text x="166" y="486" font-family="Segoe UI, Inter, sans-serif" font-size="18" font-weight="700" fill="#F8FAFC">Apply</text>
    <text x="166" y="508" font-family="Segoe UI, Inter, sans-serif" font-size="13" fill="#94A3B8">agent uses the skill</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="120" y="236" width="190" height="72" rx="18" fill="#111827" stroke="#334155"/>
    <circle cx="148" cy="272" r="6" fill="#FDE68A"/>
    <text x="166" y="266" font-family="Segoe UI, Inter, sans-serif" font-size="18" font-weight="700" fill="#F8FAFC">Feedback</text>
    <text x="166" y="288" font-family="Segoe UI, Inter, sans-serif" font-size="13" fill="#94A3B8">worked / failed</text>
  </g>

  <!-- Arrows clockwise -->
  <path d="M596 150 C650 164 682 198 694 232" fill="none" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M786 314 C786 350 786 384 786 420" fill="none" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M690 520 C640 544 610 560 596 584" fill="none" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M406 626 C354 626 318 614 300 596" fill="none" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M216 456 C216 420 216 386 216 350" fill="none" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M308 270 C350 246 380 226 406 206" fill="none" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/>

  <text x="640" y="186" font-family="Segoe UI, Inter, sans-serif" font-size="12" fill="#64748B">extract</text>
  <text x="800" y="374" font-family="Segoe UI, Inter, sans-serif" font-size="12" fill="#64748B">render</text>
  <text x="626" y="566" font-family="Segoe UI, Inter, sans-serif" font-size="12" fill="#64748B">match</text>
  <text x="322" y="662" font-family="Segoe UI, Inter, sans-serif" font-size="12" fill="#64748B">apply</text>
  <text x="188" y="408" font-family="Segoe UI, Inter, sans-serif" font-size="12" fill="#64748B">record</text>
  <text x="330" y="232" font-family="Segoe UI, Inter, sans-serif" font-size="12" fill="#64748B">update</text>
</svg>