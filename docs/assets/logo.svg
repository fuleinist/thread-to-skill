<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Thread to Skills</title>
  <desc id="desc">A conversation bubble becoming a stack of structured skill steps.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="mark" x1="56" y1="64" x2="248" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="0.55" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>
    <linearGradient id="edge" x1="56" y1="64" x2="248" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A5B4FC"/>
      <stop offset="1" stop-color="#5EEAD4"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect x="4" y="4" width="1192" height="312" rx="44" fill="url(#bg)" stroke="#1E293B" stroke-width="2"/>

  <g transform="translate(56 64)" filter="url(#soft)">
    <rect x="0" y="0" width="192" height="192" rx="46" fill="url(#mark)"/>
    <rect x="1.5" y="1.5" width="189" height="189" rx="44.5" fill="none" stroke="url(#edge)" stroke-opacity="0.55" stroke-width="3"/>
    <rect x="44" y="42" width="104" height="72" rx="22" fill="#FFFFFF" fill-opacity="0.97"/>
    <path d="M62 108 L62 134 L88 112 Z" fill="#FFFFFF" fill-opacity="0.97"/>
    <circle cx="74" cy="78" r="6" fill="#4F46E5"/>
    <circle cx="96" cy="78" r="6" fill="#4F46E5"/>
    <circle cx="118" cy="78" r="6" fill="#4F46E5"/>
    <rect x="44" y="132" width="104" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.94"/>
    <rect x="44" y="150" width="82" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.68"/>
    <rect x="44" y="168" width="56" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.42"/>
    <path d="M150 136 L154 148 L166 152 L154 156 L150 168 L146 156 L134 152 L146 148 Z" fill="#FDE68A"/>
  </g>

  <text x="292" y="150" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" font-size="62" font-weight="700" letter-spacing="-1.6">
    <tspan fill="#F8FAFC">Thread </tspan><tspan fill="#FDE68A">to </tspan><tspan fill="#F8FAFC">Skills</tspan>
  </text>
  <text x="294" y="203" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" font-size="26" fill="#A5B4FC">Turn conversations into compounding agent skills.</text>
  <text x="294" y="240" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" font-size="18" fill="#94A3B8" letter-spacing="0.3">LOCAL-FIRST  ·  ZERO DEPENDENCIES  ·  OPEN AGENT SKILLS</text>

  <g transform="translate(1032 64)">
    <rect x="0" y="0" width="112" height="42" rx="21" fill="#1E293B" stroke="#334155"/>
    <text x="56" y="27" text-anchor="middle" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="17" fill="#E2E8F0">v0.1.0</text>
  </g>
